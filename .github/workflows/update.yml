name: update-feed
on:
  schedule:
    - cron: '17 12 * * *'
    - cron: '17 18 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evs-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-feed.mjs
        env:
          SITE_URL: https://rodolphoborges.github.io/euvimdesite
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: commit se mudou
        run: |
          git config user.name "evs-bot"
          git config user.email "evs-bot@users.noreply.github.com"
          git add data/videos.json sitemap.xml feed.xml v/
          # Defesa extra: se só o campo `updated` mudou, descarta o diff de
          # data/videos.json para não gerar commit vazio (o script já preserva
          # `updated` quando `videos` está igual, isto cobre regressões).
          if ! git diff --cached --quiet -- data/videos.json; then
            node -e "
              const { execSync } = require('node:child_process');
              const { readFileSync } = require('node:fs');
              try {
                const prev = JSON.parse(execSync('git show HEAD:data/videos.json', { encoding: 'utf8' }));
                const next = JSON.parse(readFileSync('data/videos.json', 'utf8'));
                if (JSON.stringify(prev.videos || []) === JSON.stringify(next.videos || [])) {
                  console.log('só timestamp mudou, descartando diff de data/videos.json');
                  execSync('git restore --staged data/videos.json && git checkout -- data/videos.json', { stdio: 'inherit' });
                }
              } catch (e) { console.log('guard skip:', e.message); }
            "
          fi
          git diff --cached --quiet || git commit -m "auto: atualiza feed $(date -u +%F)"
          git push
