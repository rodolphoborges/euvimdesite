name: transcribe
# Transcreve os vídeos em pt-BR aos poucos (legendas do YouTube ou Whisper).
# Roda a cada 6 h com orçamento de ~5 h; repositório público = minutos grátis.
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Orçamento de tempo (min)'
        default: '300'
      ids:
        description: 'IDs específicos (separados por espaço, opcional)'
        default: ''

permissions:
  contents: write

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      # yt-dlp precisa de um runtime JavaScript para o YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -U -r scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: transcrever
        env:
          MAX_MIN: ${{ github.event.inputs.max_minutes || '300' }}
          IDS: ${{ github.event.inputs.ids }}
        run: python scripts/transcribe.py --max-minutes "$MAX_MIN" ${IDS:+--ids $IDS}
      - name: commit das transcrições
        if: always()
        run: |
          git config user.name "evs-bot"
          git config user.email "evs-bot@users.noreply.github.com"
          git add data/transcripts data/transcribe-state.json
          git diff --cached --quiet && exit 0
          git commit -m "transcrições: +$(git diff --cached --name-only --diff-filter=A -- data/transcripts | wc -l) vídeos"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
